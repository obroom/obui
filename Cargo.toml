[package]
name = "obui"
version = "0.1.0"
edition = "2024"
description = "Obroom 程序共用的 Win32 界面零件 (卡片式设置界面、弹窗、暗色主题), obcmd 与 obcleaner 共用"
license = "MIT"
publish = false

[dependencies]
log = "0.4"
# 跟 obcmd / obcleaner 锁同一版本, 免得编两份 windows
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
